[package]
name = "open-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
ashpd = { version = "0.13", features = ["file_chooser", "screencast"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["wgpu"] }
egui = "0.37"
egui-wgpu = "0.37.0"
evdev = "0.13.2"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ksni = { version = "0.3.7", features = ["blocking"] }
libc = "0.2.191"
pollster = "1.0.1"
rustface = "0.1.7"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
