name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libwayland-dev \
            ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match Cargo.toml version $version"; exit 1; }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="open-studio-${TAG#v}-x86_64-linux"
          mkdir -p "dist/$name"
          strip -o "dist/$name/open-studio" target/release/open-studio
          cp LICENSE README.md packaging/open-studio.desktop packaging/open-studio.png packaging/install.sh "dist/$name/"
          chmod +x "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Open Studio ${{ env.TAG }}
          # Betas ship as full releases, so the newest is marked Latest; the
          # notes say it's a beta.
          prerelease: false
          make_latest: true
          body_path: packaging/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256

  appimage:
    name: AppImage
    needs: linux
    uses: ./.github/workflows/appimage.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
